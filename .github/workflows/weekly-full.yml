name: Weekly Full Interview Crawl

on:
  schedule:
    # 每周日 02:00 UTC = 10:00 北京时间，做一次全量深挖
    - cron: "0 2 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  # GitHub Models 调用权限（与 Copilot 同源模型）
  models: read

concurrency:
  group: interview-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Full crawl
        run: python -m src.main --config config.yaml --full

      - name: Analyze with GitHub Models
        # 每周补齐日常额度没跑完的公司-岗位分析
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m src.analyze --config config.yaml --limit 150

      - name: Commit and push changes
        run: |
          if [ -z "$(git status --porcelain -- README.md data/ interviews/ analysis/)" ]; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A README.md data interviews analysis
          git commit -m "chore: weekly full interview crawl and analysis ($(date -u +%Y-%m-%d))"
          git push
