# 面试经验聚合爬虫配置
output:
  readme: README.md
  # 原始数据按公司分片存放在该目录，每个公司一个 JSON，避免单文件超过 GitHub 100MB 限制
  data: data/interviews
  # 按公司/岗位拆分的 Markdown 目录
  interviews: interviews
  # 只保留最近 N 天内仍然出现在采集结果里的记录
  retention_days: 365

# 只保留国内公司；设为 false 可恢复国外公司
exclude_foreign_companies: true
# 额外指定要剔除的公司（虾皮为新加坡公司）
exclude_companies:
  - 虾皮
# 已停用的来源，其历史数据会在下次运行时一并清理
exclude_sources:
  - prachub

