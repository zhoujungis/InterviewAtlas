crawl:
  timeout: 20
  retries: 3
  # 每次请求之间的间隔（秒），避免给站点造成压力
  delay: 0.5
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

sources:
  # 牛客网：搜索接口单关键词最多返回 3 页，用大量「公司 + 岗位」关键词组合扩大覆盖
  nowcoder:
    enabled: true
    max_pages: 3
    full_max_pages: 3
    page_size: 20
    # 搜索接口只返回截断正文，用详情接口补全全文
    fetch_content: true
    detail_workers: 6
    detail_delay: 0.2
    # 每次最多补全多少条正文，0 表示不限制
    detail_limit: 0
    queries:
      - 面经
      - 面试经验
      - 秋招 面经
      - 春招 面经
      - 社招 面经
      - 实习 面经
      - 后端 面经
      - 前端 面经
      - 算法 面经
      - 测试 面经
      - 产品 面经
    company_queries:
      - "{company} 面经"
      - "{company} 面试经验"
    full_company_queries:
      - "{company} 面经"
      - "{company} 面试经验"
      - "{company} 一面"
      - "{company} 二面"
      - "{company} 测试 面经"
      - "{company} 产品 面经"

  # 面试鸭：抓取全部企业题库，并把题库中的题目展开成条目
  mianshiya:
    enabled: true
    page_size: 100
    max_banks: 400
    # 每个题库每个查询最多翻 5 页（接口硬上限）
    max_question_pages: 5

  # PracHub：英文面试经验，以国外公司为主，已停用
  prachub:
    enabled: false
    max_pages: 10
    full_max_pages: 240

  # 掘金：搜索接口支持深分页，并抓取文章全文
  juejin:
    enabled: true
    max_pages: 3
    full_max_pages: 8
    fetch_content: true
    detail_workers: 6
    detail_delay: 0.2
    detail_limit: 0
    queries:
      - 面经
      - 面试经验
      - 秋招 面经
      - 春招 面经
      - 社招 面经
      - 实习 面经
      - 后端 面经
      - 前端 面经
      - 算法 面经
      - 测试 面经
      - 数据 面经
      - 产品 面经
      - 面试 经验
      - 面试 复盘
      - 面试 总结
      - 大厂 面经
      - 后端 面试
      - 前端 面试
    company_queries:
      - "{company} 面经"
    full_company_queries:
      - "{company} 面经"
      - "{company} 面试经验"

# 用 GitHub Models 对采集结果做「公司-岗位」与「岗位」两个维度的整合分析
analysis:
  output: analysis
  # 与 Copilot 同源的 GitHub Models 模型；需 workflow 具备 models: read 权限
  model: openai/gpt-4o-mini
  # 只有条数达标的公司-岗位组才分析，避免样本过少时生成胡编内容
  min_records: 20
  # 兜底分类不参与分析：公司/岗位未识别的内容无法做有意义的归纳
  company_exclude:
    - 其他公司
  position_exclude:
    - 其他岗位
  # 每组最多喂多少条面经、每条截断到多少字
  max_records_per_group: 8
  max_chars_per_record: 1200
  # 单次提示词的正文上限，控制成本
  max_prompt_chars: 16000
  # 岗位维度汇总：最多纳入多少家公司、每家公司摘要截断长度
  max_companies_per_position: 16
  max_chars_per_company: 700
  position_min_companies: 3
  # 单次运行的调用预算，避免超出 GitHub Models 免费额度；未分析完的组次日继续
  max_calls_per_run: 100
  # GitHub Models 免费档约 15 RPM，这里保守限速
  rpm: 12
  workers: 2
  timeout: 90
  retries: 3
  # 记录增长超过 10%（至少 5 条）或超过该天数时重新分析
  refresh_after_days: 30
